    <script>
      const d=JSON.parse(document.querySelector('#progress-data').textContent);
      const list=(items)=>'<ul>'+items.map((item)=>'<li>'+item+'</li>').join('')+'</ul>';
      const cards=d.metrics.map((item)=>'<div class="metric">'+item[0]+'<b>'+item[1]+'</b></div>').join('');
      document.querySelector('#report').innerHTML=
        '<section><strong>Current system/task</strong><br>'+d.system+'<br>'+d.task+'</section>'+
        '<section><strong>Current truthful status</strong><br>'+d.status+'</section>'+
        '<section><strong>Latest critic verdict</strong><br>'+d.criticVerdict+'</section>'+
        '<section><strong>Biggest gap</strong><br>'+d.biggestGap+'</section>'+
        '<h2>COMPLETED</h2><section>'+list(d.completed)+'</section>'+
        '<h2>WEAK AREAS</h2><section>'+list(d.weak)+'</section>'+
        '<h2>PHYSICS / PERFORMANCE METRICS</h2><div class="grid">'+cards+'</div>';

  </body>
</html>
